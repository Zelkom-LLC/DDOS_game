version: '3.9'

x-service-configuration: &base
    # restart: on-failure
    # network_mode: host # На Mac странно работает данная настройка
    mem_limit: 256MB
    cpu_count: 2
    cpus: '1'

services:
    referee:
        build:
            context: ./referee
            dockerfile: Dockerfile
        mem_limit: 1GB
        env_file: .targets
        image: referee
        ports:
            - "3001:3000"
    attacker-1:
        <<: *base
        build:
            context: ./axum_player
            dockerfile: Dockerfile
        image: attacker-1
        ports:
            - "8001:3000"
    attacker-2:
        <<: *base
        build:
            context: ./gin_player
            dockerfile: Dockerfile
        image: attacker-2
        env_file: ./gin_player/.env
        ports:
            - "8002:8000"

